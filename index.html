<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#000000">
	<title>Wireframe Cube</title>
	<style>
		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			min-height: 100%;
			background: #000;
			color: #bbb;
			font-family: "MS PGothic", "MSPGothic", "MS Pゴシック", "Courier New", monospace;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			min-height: 100dvh;
			display: grid;
			place-items: center;
			padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
		}

		main {
			width: 100%;
			max-width: 760px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 28px;
		}

		canvas {
			display: block;
			width: min(220px, 52vw);
			aspect-ratio: 1;
			background: #000;
			image-rendering: pixelated;
		}

		h1 {
			margin: 0;
			font-size: 14px;
			font-weight: normal;
			letter-spacing: 0.3em;
			text-transform: uppercase;
			color: #e2e2e2;
			text-align: center;
		}

		.sub {
			margin: -18px 0 0;
			font-size: 11px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: #666;
			text-align: center;
		}

		.modes {
			width: 100%;
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 12px;
		}

		.mode {
			display: flex;
			flex-direction: column;
			gap: 8px;
			padding: 16px;
			min-height: 110px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			color: inherit;
			text-decoration: none;
			transition: border-color 0.15s, background 0.15s;
		}

		.mode:hover, .mode:focus-visible {
			border-color: rgba(255, 255, 255, 0.7);
			background: rgba(255, 255, 255, 0.04);
			outline: none;
		}

		.mode:active { background: rgba(255, 255, 255, 0.08); }

		.name {
			font-size: 13px;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			color: #e2e2e2;
		}

		.desc {
			font-size: 11px;
			line-height: 1.5;
			color: #777;
		}

		.key {
			display: none;
			margin-top: auto;
			font-size: 10px;
			color: #555;
		}

		@media (hover: hover) and (pointer: fine) {
			.key { display: block; }
		}

		@media (max-width: 640px) {
			main { gap: 22px; }
			.modes { grid-template-columns: 1fr; }
			.mode { min-height: 0; padding: 16px 18px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.mode { transition: none; }
		}
	</style>
</head>
<body>
	<main>
		<canvas id="cube" aria-hidden="true"></canvas>
		<h1>Wireframe Cube</h1>
		<p class="sub">Choose a control mode</p>

		<nav class="modes">
			<a class="mode" href="gyro.html">
				<span class="name">Gyro</span>
				<span class="desc">Tilt your phone to rotate the cube.</span>
				<span class="key">Press 3</span>
			</a>
			<a class="mode" href="keyboard.html">
				<span class="name">Keyboard</span>
				<span class="desc">WASD, Q/E.</span>
				<span class="key">Press 1</span>
			</a>
			<a class="mode" href="controller.html">
				<span class="name">Controller</span>
				<span class="desc">PS5 controller</span>
				<span class="key">Press 4</span>
			</a>
			<a class="mode" href="camera.html">
				<span class="name">Camera</span>
				<span class="desc">Pinch and move your hand. Needs camera access.</span>
				<span class="key">Press 2</span>
			</a>

		</nav>
	</main>

	<script>
		window.CUBE_SIZE = 50;
	</script>
	<script src="cube-core.js"></script>
	<script>
		(function () {
			var Core = window.CubeCore;
			var canvas = document.getElementById("cube");
			var ctx = canvas.getContext("2d");
			var matrix = Core.IDENTITY_MATRIX.slice();

			var keys = { "1": "keyboard.html", "2": "camera.html", "3": "gyro.html", "4": "controller.html" };
			addEventListener("keydown", function (e) {
				if (keys[e.key] && !e.ctrlKey && !e.metaKey && !e.altKey) location.href = keys[e.key];
			});

			function draw() {
				Core.drawWireframe(ctx, canvas.clientWidth, canvas.clientHeight, matrix);
			}

			function resize() {
				var dpr = window.devicePixelRatio || 1;
				canvas.width = Math.round(canvas.clientWidth * dpr);
				canvas.height = Math.round(canvas.clientHeight * dpr);
				draw();
			}

			function rotX(a) {
				var c = Math.cos(a), s = Math.sin(a);
				return [1, 0, 0, 0, c, -s, 0, s, c];
			}

			function rotY(a) {
				var c = Math.cos(a), s = Math.sin(a);
				return [c, 0, s, 0, 1, 0, -s, 0, c];
			}

			matrix = Core.multiply(rotX(0.5), rotY(0.6));

			addEventListener("resize", resize);
			resize();

			if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

			var last = 0;
			function loop(now) {
				requestAnimationFrame(loop);
				var dt = Math.min((now - last) / 1000 || 0.016, 0.1);
				last = now;
				var delta = Core.multiply(rotX(0.27 * dt), rotY(0.4 * dt));
				matrix = Core.orthonormalize(Core.multiply(delta, matrix));
				draw();
			}
			requestAnimationFrame(loop);
		})();
	</script>
</body>
</html>
